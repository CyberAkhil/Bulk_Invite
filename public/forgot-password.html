<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Forgot password — Bulk Invite</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<script src="theme.js"></script>
<style>
  .auth-wrap { max-width: 380px; margin: 80px auto; padding: 0 24px; }
  .auth-wrap .panel { padding: 28px 26px; }
</style>
</head>
<body>

<div class="auth-wrap">
  <h1 class="page-title" style="text-align:center">Bulk<span style="color:var(--accent)">Invite</span></h1>
  <p class="page-sub" style="text-align:center; margin-left:auto; margin-right:auto;">Enter your email and we'll send a reset link.</p>

  <div class="panel">
    <div class="field">
      <label for="email">Email</label>
      <input type="text" id="email" />
    </div>
    <button class="btn btn-primary" id="sendBtn" style="width:100%">Send reset link</button>
    <p class="hint" id="msg"></p>
    <p class="hint"><a href="login.html">Back to login</a></p>
  </div>
</div>

<script>
document.getElementById("sendBtn").addEventListener("click", async () => {
  const email = document.getElementById("email").value.trim();
  const msg = document.getElementById("msg");
  const res = await fetch("/api/auth/forgot-password", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ email }),
  });
  const data = await res.json();
  msg.textContent = data.message || data.error || "Something went wrong.";
});
</script>
</body>
</html>
