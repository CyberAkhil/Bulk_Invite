<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Reset password — Bulk Invite</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<script src="theme.js"></script>
<style>
  .auth-wrap { max-width: 380px; margin: 80px auto; padding: 0 24px; }
  .auth-wrap .panel { padding: 28px 26px; }
</style>
</head>
<body>

<div class="auth-wrap">
  <h1 class="page-title" style="text-align:center">Bulk<span style="color:var(--accent)">Invite</span></h1>
  <p class="page-sub" style="text-align:center; margin-left:auto; margin-right:auto;">Set a new password.</p>

  <div class="panel">
    <div class="field">
      <label for="password">New password</label>
      <input type="password" id="password" />
    </div>
    <button class="btn btn-primary" id="resetBtn" style="width:100%">Set new password</button>
    <p class="hint" id="msg"></p>
  </div>
</div>

<script>
const token = new URLSearchParams(location.search).get("token");

document.getElementById("resetBtn").addEventListener("click", async () => {
  const password = document.getElementById("password").value;
  const msg = document.getElementById("msg");

  if (!token) {
    msg.textContent = "This reset link is missing its token — request a new one.";
    return;
  }

  const res = await fetch("/api/auth/reset-password", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ token, password }),
  });
  const data = await res.json();

  if (!res.ok) {
    msg.textContent = data.error;
    return;
  }

  msg.textContent = "Password updated. Redirecting to login…";
  setTimeout(() => (location.href = "login.html"), 1500);
});
</script>
</body>
</html>
